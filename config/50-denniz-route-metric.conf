# NetworkManager defaults for denniz: Wi-Fi is the primary uplink, Ethernet (USB hub) only the fallback.
# Both may be up at once; the lower metric wins the default route, so traffic moves to Ethernet only when
# Wi-Fi is down (the opposite of the 9 Pro, whose USB 3 Ethernet is faster than its Wi-Fi; denniz is USB 2.0).
# Install: /etc/NetworkManager/conf.d/50-denniz-route-metric.conf
[connection-denniz-wifi]
match-device=type:wifi
ipv4.route-metric=100
ipv6.route-metric=100

[connection-denniz-ethernet]
match-device=type:ethernet
ipv4.route-metric=700
ipv6.route-metric=700
connection.autoconnect-priority=-10
