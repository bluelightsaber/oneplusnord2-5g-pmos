# Safety net for denniz (no serial, no display): let the hardware watchdog (mtk-wdt, TOPRGU, max 31 s) reset the
# phone if systemd (PID 1) hangs, or if a reboot hangs in a driver's shutdown path. A reset boots the normal
# slot (Android during RAM tests, pmOS once installed).
# Install: /etc/systemd/system.conf.d/10-denniz-watchdog.conf
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=30s
