# Safety net for denniz: if the boot never reaches multi-user (a driver probe or a service stuck, as seen with
# an experimental display kernel: kernel alive, no sshd), force a reboot after 10 minutes instead of waiting
# for someone to hold the power button. The hardware watchdog (10-denniz-watchdog.conf) covers a hung reboot.
# Install: /etc/systemd/system/multi-user.target.d/10-denniz-timeout.conf
[Unit]
JobTimeoutSec=10min
JobTimeoutAction=reboot-force
